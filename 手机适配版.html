<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>随便堂 · 书籍收纳</title>
<style>
  :root {
    --paper:   #e8dcc0;
    --ink:     #777a77;
    --ink-lt:  #a39fa1;
    --cinnabar:#A9A082;
    --gold:    #f8f6ea;
    --wood:    #fffdfb;
    --wood-lt: #EAE4D1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: url("images/suibian.jpg") center/cover no-repeat fixed;
  }

  h1 {
    text-align: center;
    font-size: 24px;
    color: var(--cinnabar);
    letter-spacing: 8px;
    margin-bottom: 8px;
    text-shadow: 1px 1px 0 rgba(0,0,0,.4), 0 0 20px rgba(255, 255, 255, 0.8);
  }
  .hint {
    text-align: center; font-size: 14px;
    color: var(--gold); letter-spacing: 2px; margin-bottom: 22px;
  }

  /* 书架 */
  .shelves { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .shelf {
    flex: 1; min-width: 320px; max-width: 360px;
    background: 
      linear-gradient(rgba(250, 245, 235, 0.4), rgba(240, 235, 225, 0.6)),
      url("images/shujia.jpg") center/cover no-repeat;
    border: 2px solid #2a1f14;
    border-bottom: 10px solid #2a1f14;
    border-radius: 12px;
    padding: 10px;
    min-height: 240px;
    transition: border-color .2s, background .2s;
    box-shadow: inset 0 5px 15px rgba(0,0,0,.40), 0 8px 20px rgba(0,0,0,.6);
  }
  .shelf.dragover { border-color: var(--cinnabar); }
  .shelf h2 {
    font-size: 17px; text-align: center; 
    color: #4E3227;
    letter-spacing: 5px; padding-bottom: 8px; margin-bottom: 10px;
    border-bottom: none; font-weight: normal; position: relative;
  }
  .shelf h2::after {
    content: ""; position: absolute; bottom: 0; left: 15%; right: 15%;
    height: 1.5px; background: #4E3227;
  }
  .shelf .books {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 6px; justify-items: center;
  }

  /* 书桌 */
  .desk {
    margin: 26px auto 0;
    background:
      linear-gradient(rgba(232,220,192,.04), rgba(232,220,192,.04)),
      repeating-linear-gradient(90deg, #DFCEB4 0 20px, #D4C1A6 20px 40px);
    border: 2px dashed var(--wood-lt);
    border-radius: 6px; padding: 18px 16px;
    display: grid; grid-template-columns: repeat(7, 90px);
    gap: 6px; justify-content: center;
    min-height: 120px;
    box-shadow: inset 0 0 20px rgba(0,0,0,.5);
  }
  .desk-label {
    grid-column: 1 / -1; width: 100%; text-align: center; font-size: 14px;
    color: var(--gold); letter-spacing: 3px; margin-bottom: 8px;
  }

  /* 古籍书本 */
  .book {
    width: 90px; height: 114px;
    background: url("images/shu.jpg") center/cover no-repeat;
    color: #6b6b6b; font-size: 12px;
    writing-mode: vertical-rl; text-orientation: upright; letter-spacing: 3px;
    display: flex; align-items: flex-start; justify-content: flex-start;
    padding: 12px 10px 8px 6px;
    border: 1px solid #d8d4cc; border-left: 5px solid #f5f2ec;
    border-radius: 2px 4px 4px 2px; cursor: grab; position: relative;
    box-shadow: inset 0 0 30px rgba(200,195,185,.4), 3px 4px 10px rgba(0,0,0,.3);
    transition: transform .15s, box-shadow .15s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .book::before {
    content: ""; position: absolute; left: 1px; top: 0; bottom: 0; width: 3px;
    background: repeating-linear-gradient(to bottom, transparent 0 8px, #999 8px 11px);
    z-index: 2;
  }
  .book:hover { transform: translateY(-5px) rotate(-2deg); box-shadow: 4px 8px 18px rgba(0,0,0,.4); }
  .book:active { cursor: grabbing; }
  .book.dragging { opacity: .4; }

  /* 手机选中高亮 */
  .book.selected {
    transform: translateY(-5px) scale(1.05);
    box-shadow: 0 0 15px rgba(169, 160, 130, 0.8);
    border-color: var(--cinnabar);
    z-index: 10;
  }

  /* 弹窗 */
  .modal, .notice, .win-modal {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.75); justify-content: center; align-items: center;
  }
  .modal { z-index: 10; }
  .notice, .win-modal { z-index: 100; background: rgba(0,0,0,.85); }
  .modal.show, .notice.show, .win-modal.show { display: flex; }
  
  .modal-box, .notice-box, .win-box {
    background:#ededec; color: var(--ink); padding: 32px 36px;
    max-width: min(550px, 90vw); text-align: center;
    border: 2px solid var(--gold);
    box-shadow: 0 0 0 6px var(--wood), 0 0 0 8px var(--gold), 0 20px 50px rgba(0,0,0,.8);
    animation: bookOpen .35s ease;
  }
  @keyframes bookOpen { from { transform: scale(.85) rotateX(25deg); opacity: 0; } to { transform: scale(1) rotateX(0); opacity: 1; } }
  
  .modal-box h3, .notice-box h3, .win-box h3 {
    font-size: 22px; margin-bottom: 16px; color: var(--cinnabar);
    letter-spacing: 6px; font-weight: normal;
  }
  .modal-box p, .notice-box p, .win-box p {
    font-size: 15px; line-height: 2; margin-bottom: 22px; color: var(--ink); letter-spacing: 1px;
  }
  .modal-quote { font-style: italic; font-size: 16px; color: #a8a49c; letter-spacing: 2px; margin-bottom: 18px; }
  .modal-box button, .notice-box button, .win-box button {
    background: var(--cinnabar); color: #e8dcc0; border: none; padding: 10px 30px; border-radius: 2px;
    cursor: pointer; font-size: 15px; font-family: inherit; letter-spacing: 4px;
  }
  .modal-box button:hover, .notice-box button:hover, .win-box button:hover { background: #8a2828; }
  
  .modal-img {
    display: none; max-width: 60%; max-height: 220px; margin: 0 auto 20px;
    border: 1px solid #d8d4cc; border-radius: 2px; object-fit: contain;
  }
  .modal-img.show { display: block; }

  /* 音乐面板 */
  #musicPanel {
    position: fixed; top: 12px; right: 12px; z-index: 200; display: flex; align-items: center; gap: 8px;
    background: rgba(0,0,0,.5); padding: 6px 12px; border-radius: 4px; opacity: .8; transition: opacity .2s;
  }
  #musicPanel:hover, #musicPanel:active { opacity: 1; }
  #musicBtn { background: none; color: #f8f6ea; border: none; cursor: pointer; font-size: 16px; font-family: inherit; padding: 0; }
  #volumeSlider { width: 80px; cursor: pointer; accent-color: #E3F9FD; }
</style>
</head>
<body>

<audio id="bgm" loop>
  <source src="music/hangzhou.mp3" type="audio/mpeg">
</audio>

<div id="musicPanel">
  <button id="musicBtn" onclick="toggleMusic()">🔊</button>
  <input type="range" id="volumeSlider" min="0" max="100" value="50" oninput="changeVolume(this.value)">
</div>

<div class="notice show" id="notice">
  <div class="notice-box">
    <h3>背景介绍</h3>
    <p>
      你是陈宅的小侍女。<br>
      郎主寒毒痊愈后，偶有记忆恍惚之时。<br>
      江郎君便会带着郎主翻阅随便堂中书信，回忆往昔，唤其神思。<br>
      只是这两人都不喜收拾，书籍归档之事，便只有你来做了。<br>
      待书卷全部归位，今日的活儿就算做完了。<br>
      <span style="font-size:12px;">（点击"上工"后会有BGM响起，右上角可调节音量）</span><br>
      <span style="font-size:12px; color:#a83232;">（电脑端点书阅读，拖拽归位；手机端点书选中，点书架归位）</span><br>
    </p>
    <button onclick="closeNotice()">上 工</button>
  </div>
</div>

<h1>书 架</h1>
<p class="hint">点 书 观 其 文 · 拖 书 归 其 位</p>

<div class="shelves">
  <div class="shelf" data-category="书籍"><h2>书 籍</h2><div class="books"></div></div>
  <div class="shelf" data-category="信笺"><h2>信 笺</h2><div class="books"></div></div>
  <div class="shelf" data-category="杂闻"><h2>杂 闻</h2><div class="books"></div></div>
  <div class="shelf" data-category="特殊"><h2>特 殊</h2><div class="books"></div></div>
</div>

<div class="desk" id="desk">
  <div class="desk-label">— 待 归 之 卷 —</div>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <p class="modal-quote" id="modalQuote"></p>
    <img class="modal-img" id="modalImg" alt="">
    <p id="modalDesc"></p>
    <button onclick="closeModal()">合 卷</button>
  </div>
</div>

<div class="win-modal" id="winModal">
  <div class="win-box">
    <h3>下 工</h3>
    <p>活都做完了！快去吃饭吧！^ᵕ^</p>
    <button onclick="closeWin()">好 耶</button>
  </div>
</div>

<script>
const books = [
  { id:1, title:"与江晏书 （天福年间）", quote:"江晏，出来玩！", desc:"昔日郎主与江郎君的通信。<br>信封上的字迹有些褪色。<br>不要私下翻阅为好……", category:"信笺" },
  { id:2, title:"回陈子奚书 （天福年间）", quote:"陈子奚，青州见。", desc:"昔日江郎君与郎主的回信。<br>信封上的字迹有些褪色。<br>不要私下翻阅为好……", category:"信笺" },
  { id:3, title:"与江晏书 （天福年间）", quote:"江晏，此次北行可还顺利？", desc:"昔日郎主与江郎君的通信。<br>信封褶皱得很厉害，似乎曾经长时间被人揣在怀里。<br>不要私下翻阅为好……", category:"信笺" },
  { id:4, title:"回陈子奚书 （天福年间）", quote:"陈子奚，我到滹沱了。", desc:"昔日江郎君与郎主的回信。<br>信封上有干涸的泥水印记。<br>不要私下翻阅为好……", category:"信笺" },
  { id:5, title:"与江晏书 （天福年间）", quote:"江晏，我来接你。", desc:"昔日郎主与江郎君的通信。<br>这封信似乎没有寄出。<br>不要私下翻阅为好……", category:"信笺" },
  { id:6, title:"与陈子奚书 （天福年间）", quote:"陈子奚，别来。", desc:"昔日江郎君与郎主的通信。<br>这封信似乎没有寄出。<br>不要私下翻阅为好……", category:"信笺" },
  { id:7, title:"与陈子奚书 （开运年间）", quote:"陈子奚，回春堂可还安好？", desc:"昔日郎主与江郎君的通信。<br>信封上的字迹有些褪色。<br>不要私下翻阅为好……", category:"信笺" },
  { id:8, title:"回江晏书 （开运年间）", quote:"江晏，江南诸事已了。", desc:"昔日郎主与江郎君的回信。<br>信封上沾着很浓的药味。<br>不要私下翻阅为好……", category:"信笺" },
  { id:9, title:"与江晏书 （乾祐年间）", quote:"江晏，下月我去寻你。", desc:"昔日郎主与江郎君的通信。<br>火漆上封着一片柳叶。<br>不要私下翻阅为好……", category:"信笺" },
  { id:11, title:"回陈子奚书 （乾祐年间）", quote:"陈子奚，不要胡闹。", desc:"昔日江郎君与郎主的回信。<br>不要私下翻阅为好……", category:"信笺" },
  { id:12, title:"与江晏书 （显德年间）", quote:"江晏，此行需要我帮忙么？", desc:"昔日郎主与江郎君的通信。<br>火漆上封着一朵杏花。<br>不要私下翻阅为好……", category:"信笺" }, 
  { id:13, title:"回陈子奚书 （显德年间）", quote:"陈子奚，顾好自己。", desc:"昔日江郎君与郎主的回信。<br>不要私下翻阅为好……", category:"信笺" },
  { id:14, title:"与陈子奚书 （建隆年间）", quote:"陈子奚，小孩拜托你了。", desc:"昔日江郎君与郎主的通信。<br>不要私下翻阅为好……", category:"信笺" },
  { id:15, title:"回江晏书 （建隆年间）", quote:"江晏，我接到小孩了。", desc:"昔日郎主与江郎君的回信。<br>火漆上封着一片鸟羽。<br>不要私下翻阅为好……", category:"信笺" },
  { id:16, title:"与陈子奚书 （乾德年间）", quote:"不日即归。", desc:"昔日江郎君与郎主的通信。<br>信封非常薄，字迹潦草，归心似箭。<br>不要私下翻阅为好……", category:"信笺" },
  { id:17, title:"白香山诗集", quote:"今夜闻君琵琶语，如听仙乐耳暂明。", desc:"香山居士的诗集。<br>郎主做了很多批注，读不太懂，还是别看了……", category:"书籍" },
  { id:18, title:"家宅飞蛾防治方略", quote:"蛾蠹不除，家宅不宁！", desc:"一本讲述如何在家宅中防治飞蛾的书。<br>封底有个模糊的鳞粉印，似乎有人拿此书拍过蛾子。", category:"书籍" },
  { id:19, title:"青溪武学笔记", quote:"医者，当顾惜己身。", desc:"记载着青溪武学的册子。<br>《青山执笔》那一半比《明川药典》更旧一些。", category:"书籍" },
  { id:20, title:"燕云地理志", quote:"上稽沿革，下录风物。", desc:"记录着燕云地区山川风土的地方志书。", category:"书籍" },
  { id:21, title:"无名刀法", quote:"江晏，喝酒去吗？", desc:"一本刀法武学。<br>看不懂，但郎主写了很多批注，郎主真厉害。", category:"书籍" },
  { id:22, title:"钱塘食单", quote:"需草鱼一尾，饿养二三日。", desc:"一本江南菜谱。<br>西湖醋鱼那一页折了角，还做了批注，看字迹是江郎君的。", category:"书籍" },
  { id:23, title:"木经", quote:"自梁以上为上分，地以上为中分，阶为下分。", desc:"都料匠喻皓所著的木工专书。<br>江郎君最近时常翻阅，就因为郎主叫他给自己打张躺椅……", category:"书籍" },
  { id:24, title:"璎璎巧计酬恩义", quote:"月色如水，二人终出樊笼，自此……天高海阔。", desc:"一本坊间流行的武侠话本。<br>郎主看完后说自己喜欢侠女璎璎，江郎君气得那天夜里没吃饭。", category:"书籍" },
  { id:25, title:"醉春风", quote:"女人，你引起了我的注意。", desc:"一本坊间流行的恋爱话本。<br>其中男主角的原型很明显是玉山君。<br>郎主怎么会有？江郎君不管吗？", category:"书籍" },
  { id:26, title:"露水情深之冷面大侠别想逃", quote:"你以为你得到的是谁的爱！", desc:"一本武侠题材的恋爱话本。<br>郎主为什么会喜欢看这个？坊间早就不流行了。", category:"书籍" },
  { id:27, title:"氿留断案集", quote:"神探燕拂云，抽丝剥茧，智断谜案！", desc:"一本不知是话本还是实录的探案集。<br>原本是小少主硬塞给少主的，结果被郎主截胡了。", category:"书籍" },
  { id:28, title:"回春堂四月收支", quote:"本月支取平衡。", desc:"安总管每月汇报给郎主的账册略记。<br>只是郎主很少翻看，现在都八月了，这本还是新的……", category:"杂闻" },
  { id:29, title:"俦游小札", quote:"命俦啸侣，北行而游。", desc:"郎主年少时和江郎君出游写下的游记。<br>读起来很有意思！", category:"杂闻" },
  { id:30, title:"饮中别录", quote:"洞庭春色，色香味三绝。", desc:"江郎君写的一册品酒指南。记录了他在各地喝到的美酒。<br>看来郎君去过不少地方呢。", category:"杂闻" },
  { id:31, title:"渡厄卷", quote:"庙前莫寻声，一人不进庙。", desc:"一卷志怪……小品？<br>看不太懂，似乎是小少主带回来的。", category:"杂闻" },
  { id:32, title:"东方第一枝", quote:"花间遗事，江湖趣闻。", desc:"最新一期的东方第一枝。<br>郎主和小少主都爱看这个。", category:"杂闻" },
  { id:33, title:"春秋随笔", quote:"杏林春暖，橘井泉香。", desc:"子真少主昔年求学时的日记。<br>明知郎主看了会伤心，江郎君怎么还是拿出来了……", category:"杂闻" },
  { id:34, title:"笋味", quote:"笋，世间第一品之物。", desc:"安总管自己写的笋类食谱。<br>不知为何，后半本记着几招刀法……？", category:"杂闻" },
  { id:35, title:"江湖百晓", quote:"今以书赠君，望君应律救世。", desc:"不知何人所写的密文小册。<br>有不少江郎君的批注，字里行间颇有为人师之感。", category:"杂闻" },
  { id:36, title:"尝草录", quote:"尝草者，神农氏所为也。", desc:"郎主所写的小册。里面记载着不少有趣的杭州风物。<br>原本给了小少主，现存放于随便堂。", category:"杂闻" },
  { id:37, title:"晏过集", quote:"都怪江无浪。", desc:"郎主在里面写了很多江郎君的坏话。<br>但细看起来，又怪肉麻的……", category:"杂闻" },
  { id:38, title:"草木薄方", quote:"想来城中营生如此之人，何止一二？", desc:"少主在回春堂坐诊时的手记。<br>记录了他特意为穷苦人改写的薄方。<br>不知为何，没有署名。", category:"杂闻" },
  { id:39, title:"平澜记事", quote:"侠聚平澜！", desc:"小少主上学时写的日记。<br>看得出来，小少主在书院里交到了好多朋友，真好呀。", category:"杂闻" },
  { id:40, title:"玉山君画像", img:"images/yushan.jpg", desc:"被刻意收起来的玉山君画像。<br>原本藏在迟早斋的书架中，现存放于随便堂。", category:"特殊" },
  { id:41, title:"清河舆图", img:"images/qinhe.jpg", desc:"一张清河地区的舆图。<br>郎主在某个地点做了记号。", category:"特殊" },
  { id:42, title:"少主画像", img:"images/xiaoshixiong.jpg", desc:"少主荣登青云榜时的画像。<br>因为郎主想看，小少主就从榜单上撕回来了……", category:"特殊" },
  { id:43, title:"兰陵王入阵曲", img:"images/lanwang.jpg", desc:"《兰陵王入阵曲》的曲谱。<br>江郎君最近在练习，说要给拉给郎主听。<br>能说吗？他拉二胡像锯木头……", category:"特殊" },
  { id:44, title:"还陕述怀", img:"images/huai.jpg", desc:"昔年郎主练字时写的。<br>是唐太宗李世民所作的诗。", category:"特殊" },
  { id:45, title:"倭国鬼谈", quote:"东瀛邪典，诡作怪谈。", desc:"一本记载倭国鬼怪的志怪书。小少主从海客港淘来的。<br>郎主读完之后很有兴趣，说想去倭国看看，江郎君说不行。", category:"书籍" },
  { id:46, title:"茶经", quote:"茶者，南方之嘉木也。", desc:"茶圣陆羽所著的茶学专书。<br>郎主痊愈后亦不能多饮，日常便改了喝茶。<br>江郎君和少主快把这书翻旧了。", category:"书籍" },
  { id:47, title:"市井闲话", quote:"眼观六路，耳听八方", desc:"安总管卖菜时听来的各种坊间传闻。<br>内容不知真假，但都很有趣。", category:"杂闻" },

const desk = document.getElementById('desk');
const modal = document.getElementById('modal');
let selectedBook = null; 

// 判断是否为触屏设备（手机/平板）
const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

const shuffled = [...books].sort(() => Math.random() - 0.5);

shuffled.forEach(book => {
  const el = document.createElement('div');
  el.className = 'book';
  el.draggable = true;
  el.innerHTML = book.title;
  el.dataset.id = book.id;
  el.dataset.category = book.category;

  el.addEventListener('dragstart', e => {
    e.dataTransfer.setData('text/plain', book.id);
    el.classList.add('dragging');
  });
  el.addEventListener('dragend', () => el.classList.remove('dragging'));

  // 电脑端：点一下直接看弹窗；手机端：点一下选中
  el.addEventListener('click', (e) => {
    if (!isTouchDevice) {
      // 电脑端逻辑
      if (el.draggable) openModal(book); // 没归位的书点一下弹窗
      else openModal(book);              // 归位的书点一下也弹窗
    } else {
      // 手机端逻辑
      if (!el.draggable) { 
        // 已经归位的书，点一下直接看书
        openModal(book); 
        return; 
      }
      // 没归位的书，点一下是选中/取消选中
      if (selectedBook === el) {
        el.classList.remove('selected');
        selectedBook = null;
      } else {
        if (selectedBook) selectedBook.classList.remove('selected');
        selectedBook = el;
        el.classList.add('selected');
      }
    }
  });

  desk.appendChild(el);
});

function openModal(book) {
  document.getElementById('modalTitle').textContent = `《${book.title.replace(/<br>/g, ' ')}》`;
  document.getElementById('modalQuote').textContent = book.quote ? `"${book.quote}"` : '';
  document.getElementById('modalDesc').innerHTML = book.desc;

  const img = document.getElementById('modalImg');
  if (book.img) {
    img.src = book.img;
    img.classList.add('show');
  } else {
    img.classList.remove('show');
    img.src = '';
  }
  modal.classList.add('show');
}
function closeModal() { modal.classList.remove('show'); }
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

function closeNotice() {
  document.getElementById('notice').classList.remove('show');
  const bgm = document.getElementById('bgm');
  bgm.volume = 0.5;
  bgm.play().catch(err => console.log('音乐播放失败：', err));
}

function closeWin() { document.getElementById('winModal').classList.remove('show'); }
function toggleMusic() {
  const bgm = document.getElementById('bgm');
  const btn = document.getElementById('musicBtn');
  if (bgm.paused) { bgm.play(); btn.textContent = '🔊'; } 
  else { bgm.pause(); btn.textContent = '🔇'; }
}
function changeVolume(val) { document.getElementById('bgm').volume = val / 100; }

function tryPlaceBook(bookEl, shelf) {
  if (!bookEl || !shelf) return;

  if (bookEl.dataset.category === shelf.dataset.category) {
    if (shelf.dataset.category === "信笺") {
      const allBooks = [...shelf.querySelectorAll('.book'), bookEl];
      allBooks.sort((a, b) => Number(a.dataset.id) - Number(b.dataset.id));
      const booksContainer = shelf.querySelector('.books');
      booksContainer.innerHTML = '';
      allBooks.forEach(b => { b.draggable = false; b.style.cursor = 'default'; booksContainer.appendChild(b); });
    } else {
      shelf.querySelector('.books').appendChild(bookEl);
      bookEl.draggable = false;
      bookEl.style.cursor = 'default';
    }

    document.querySelectorAll('.shelf').forEach(s => s.classList.remove('dragover'));
    if (selectedBook) { selectedBook.classList.remove('selected'); selectedBook = null; }

    const r = bookEl.getBoundingClientRect();
    sparkle(r.left + r.width/2, r.top);
    checkWin();
  } else {
    bookEl.animate([
      { transform:'translateX(0)' }, { transform:'translateX(-6px)' },
      { transform:'translateX(6px)' }, { transform:'translateX(0)' }
    ], { duration:250 });
    shelf.style.borderColor = '#a83232';
    setTimeout(() => shelf.style.borderColor = '#2a1f14', 350);
  }
}

document.querySelectorAll('.shelf').forEach(shelf => {
  shelf.addEventListener('dragover', e => { e.preventDefault(); shelf.classList.add('dragover'); });
  shelf.addEventListener('dragleave', () => shelf.classList.remove('dragover'));
  shelf.addEventListener('drop', e => {
    e.preventDefault();
    shelf.classList.remove('dragover');
    const id = Number(e.dataTransfer.getData('text/plain'));
    const bookEl = document.querySelector(`.book[data-id="${id}"]`);
    tryPlaceBook(bookEl, shelf);
  });

  // 手机端点击书架归位
  shelf.addEventListener('click', () => {
    if (selectedBook) {
      tryPlaceBook(selectedBook, shelf);
    }
  });
});

function sparkle(x, y) {
  const s = document.createElement('div');
  s.textContent = '✦';
  s.style.cssText = `position:fixed; left:${x}px; top:${y}px; font-size:22px; color:#b8975a; pointer-events:none; transition:all .7s ease-out; z-index:99;`;
  document.body.appendChild(s);
  requestAnimationFrame(() => { s.style.transform = 'translateY(-50px) scale(1.8)'; s.style.opacity = '0'; });
  setTimeout(() => s.remove(), 750);
}

function checkWin() {
  if (desk.querySelectorAll('.book').length === 0) {
    document.getElementById('winModal').classList.add('show');
  }
}
</script>

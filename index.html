<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>随便堂 · 书籍收纳</title>
<style>
  :root {
    --paper:   #e8dcc0;
    --ink:     #777a77;
    --ink-lt:  #a39fa1;
    --cinnabar:#A9A082;
    --gold:    #f8f6ea;
    --wood:    #fffdfb;
    --wood-lt: #EAE4D1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: url("images/suibian.jpg") center/cover no-repeat fixed;
  }

  h1 {
    text-align: center;
    font-size: 24px;
    color: var(--cinnabar);
    letter-spacing: 8px;
    margin-bottom: 8px;
    text-shadow: 1px 1px 0 rgba(0,0,0,.6);
  }
  .hint {
    text-align: center; font-size: 14px;
    color: var(--gold); letter-spacing: 2px; margin-bottom: 22px;
  }

  /* 书架 */
  .shelves { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .shelf {
    flex: 1; min-width: 170px; max-width: 230px;
    background: linear-gradient(180deg, var(--wood-lt), var(--wood));
    border: 2px solid #2a1f14;
    border-bottom: 10px solid #2a1f14;
    border-radius: 12px;
    padding: 10px;
    min-height: 240px;
    transition: border-color .2s, background .2s;
    box-shadow: inset 0 5px 15px rgba(0,0,0,.40), 0 8px 20px rgba(0,0,0,.6);
  }
  .shelf.dragover {
    border-color: var(--cinnabar);
    background: linear-gradient(180deg, #7a5f42, #5a4530);
  }
  .shelf h2 {
    font-size: 17px; text-align: center; color: var(--cinnabar);
    letter-spacing: 5px; padding-bottom: 8px; margin-bottom: 10px;
    border-bottom: 1px solid var(--wood-lt);
    font-weight: normal;
  }
  .shelf .books { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }

  /* 书桌 */
  .desk {
    margin-top: 26px;
    background:
      linear-gradient(rgba(232,220,192,.04), rgba(232,220,192,.04)),
      repeating-linear-gradient(90deg, #DFCEB4 0 20px, #D4C1A6 20px 40px);
    border: 2px dashed var(--wood-lt);
    border-radius: 6px;
    padding: 18px 16px;
    display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;
    min-height: 120px;
    box-shadow: inset 0 0 20px rgba(0,0,0,.5);
  }
  .desk-label {
    width: 100%; text-align: center; font-size: 14px;
    color: var(--gold); letter-spacing: 3px; margin-bottom: 8px;
  }

  /* 古籍书本 */
  .book {
    width: 76px; height: 96px;
    background: linear-gradient(135deg, #fffdfb, #ecebe6);
    color: var(--ink);
    font-size: 12px;
    writing-mode: vertical-rl;
    text-orientation: upright;
    letter-spacing: 3px;
    display: flex; align-items: center; justify-content: center;
    padding: 8px 6px;
    border: 1px solid #c9b88f;
    border-left: 5px solid var(--wood);
    border-radius: 2px 4px 4px 2px;
    cursor: grab;
    position: relative;
    box-shadow:
      inset 0 0 30px rgba(180,150,90,.3),
      3px 4px 10px rgba(0,0,0,.5);
    transition: transform .15s, box-shadow .15s;
    user-select: none;
  }
  .book::before {
    content: "";
    position: absolute; left: 1px; top: 0; bottom: 0; width: 3px;
    background: repeating-linear-gradient(
      to bottom, transparent 0 9px, rgba(0,0,0,.35) 9px 11px
    );
  }
  .book:hover {
    transform: translateY(-5px) rotate(-2deg);
    box-shadow: 4px 8px 18px rgba(0,0,0,.65);
  }
  .book:active { cursor: grabbing; }
  .book.dragging { opacity: .4; }

  /* 通用弹窗遮罩 */
  .modal, .notice, .win-modal {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.75);
    justify-content: center; align-items: center;
  }
  .modal { z-index: 10; }
  .notice, .win-modal { z-index: 100; background: rgba(0,0,0,.85); }

  .modal.show, .notice.show, .win-modal.show { display: flex; }
  .notice.hide { display: none; }

  /* 弹窗内容盒（共用外观） */
  .modal-box, .notice-box, .win-box {
    background:#ededec;
    color: var(--ink);
    padding: 32px 36px;
    max-width: min(550px, 90vw);
    text-align: center;
    border: 2px solid var(--gold);
    box-shadow:
      0 0 0 6px var(--wood),
      0 0 0 8px var(--gold),
      0 20px 50px rgba(0,0,0,.8);
    animation: bookOpen .35s ease;
  }
  @keyframes bookOpen {
    from { transform: scale(.85) rotateX(25deg); opacity: 0; }
    to   { transform: scale(1) rotateX(0); opacity: 1; }
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* 弹窗标题 */
  .modal-box h3, .notice-box h3, .win-box h3 {
    font-size: 22px; margin-bottom: 16px; color: var(--cinnabar);
    letter-spacing: 6px; font-weight: normal;
  }
  /* 弹窗正文 */
  .modal-box p, .notice-box p, .win-box p {
    font-size: 15px; line-height: 2; margin-bottom: 22px;
    color: var(--ink); letter-spacing: 1px;
  }
  /* 弹窗按钮 */
  .modal-box button, .notice-box button, .win-box button {
    background: var(--cinnabar); color: #e8dcc0;
    border: none; padding: 10px 30px; border-radius: 2px;
    cursor: pointer; font-size: 15px;
    font-family: inherit; letter-spacing: 4px;
  }
  .modal-box button:hover, .notice-box button:hover, .win-box button:hover {
    background: #8a2828;
  }

  /* 音乐开关按钮 */
  #musicBtn {
    position: fixed; top: 12px; right: 12px; z-index: 200;
    background: rgba(0,0,0,.5);
    color: #f8f6ea;
    border: 1px solid #f8f6ea;
    padding: 6px 12px; border-radius: 4px;
    cursor: pointer; font-size: 16px;
    font-family: inherit;
    opacity: .7;
    transition: opacity .2s;
  }
  #musicBtn:hover { opacity: 1; }
</style>
</head>
<body>

<!-- 背景音乐 -->
<audio id="bgm" loop>
  <source src="music/hangzhou.mp3" type="audio/mpeg">
</audio>

<!-- 音乐开关 -->
<button id="musicBtn" onclick="toggleMusic()">🔊</button>

<!-- 开场告示弹窗 -->
<div class="notice show" id="notice">
  <div class="notice-box">
    <h3>背景介绍</h3>
    <p>
      你是随便堂的小侍女。<br>
      郎主寒毒痊愈后，有些记忆混乱。<br>
      江郎君常带着郎主翻阅随便堂中书籍，回忆往昔，唤其神思。<br>
      只是这两人都不喜收拾，书籍归档之事，便只有你来做了。<br>
      点书可观其文，拖书可归其架。<br>
      书卷全部归位，今日的活儿就算做完了。
    </p>
    <button onclick="closeNotice()">上 工</button>
  </div>
</div>

<h1>书 架</h1>
<p class="hint">点 书 观 其 文 · 拖 书 归 其 架</p>

<div class="shelves">
  <div class="shelf" data-category="书籍">
    <h2>书 籍</h2><div class="books"></div>
  </div>
  <div class="shelf" data-category="信笺">
    <h2>信 笺</h2><div class="books"></div>
  </div>
  <div class="shelf" data-category="杂记">
    <h2>杂 记</h2><div class="books"></div>
  </div>
</div>

<div class="desk" id="desk">
  <div class="desk-label">— 待 归 之 卷 —</div>
</div>

<!-- 书本内容弹窗 -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <p id="modalDesc"></p>
    <button onclick="closeModal()">合 卷</button>
  </div>
</div>

<!-- 通关弹窗 -->
<div class="win-modal" id="winModal">
  <div class="win-box">
    <h3>下 工</h3>
    <p>今日的活都做完了！快去吃饭吧！^ᵕ^</p>
    <button onclick="closeWin()">好 耶</button>
  </div>
</div>

<script>
// ===== 古籍数据 =====
const books = [
  { id:1, title:"与江晏书（天福十二年）", desc:"郎主与江郎君昔日的通信。<br>不要私下翻阅为好……", category:"信笺", color:"#3a7ca5" },
  { id:2, title:"白氏六帖", desc:"香山居士的诗集。<br>郎主做了很多批注，读不太懂，还是别看了……", category:"书籍", color:"#2e8b57" },
  { id:3, title:"醉春风", desc:"近来坊间流行的话本，以玉山君为原型写的恋爱故事。<br>郎主怎么会有？江郎君不管的吗……",     category:"书籍", color:"#8b5a2b" },
  { id:4, title:"青溪武学笔记",   desc:"记载着青溪武学的册子。<br>《青山执笔》的那一半比《明川药典》要旧一些。",       category:"书籍", color:"#a0522d" },
  { id:5, title:"回春堂四月收支", desc:"安总管每月汇报给郎主的账册略记。<br>只是郎主很少翻看，这本还是新的……",         category:"杂记", color:"#b03060" },
  { id:6, title:"俦游小札", desc:"郎主年少时和江郎君出游写下的游记，读起来很有意思！",         category:"杂记", color:"#6a5acd" },
];

const desk = document.getElementById('desk');
const modal = document.getElementById('modal');

// 打乱
const shuffled = [...books].sort(() => Math.random() - 0.5);

shuffled.forEach(book => {
  const el = document.createElement('div');
  el.className = 'book';
  el.draggable = true;
  el.textContent = book.title;
  el.dataset.id = book.id;
  el.dataset.category = book.category;

  el.addEventListener('click', () => openModal(book));
  el.addEventListener('dragstart', e => {
    e.dataTransfer.setData('text/plain', book.id);
    el.classList.add('dragging');
  });
  el.addEventListener('dragend', () => el.classList.remove('dragging'));

  desk.appendChild(el);
});

// ===== 弹窗控制 =====
function openModal(book) {
  document.getElementById('modalTitle').textContent = `《${book.title}》`;
  document.getElementById('modalDesc').innerHTML = book.desc;
  modal.classList.add('show');
}
function closeModal() { modal.classList.remove('show'); }
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

function closeNotice() {
  document.getElementById('notice').classList.remove('show');
  // 播放背景音乐（借用按钮点击触发，绕过浏览器自动播放限制）
  const bgm = document.getElementById('bgm');
  bgm.volume = 0.5;
  bgm.play().catch(err => console.log('音乐播放失败：', err));
}

function closeWin() {
  document.getElementById('winModal').classList.remove('show');
}

// 音乐开关
function toggleMusic() {
  const bgm = document.getElementById('bgm');
  const btn = document.getElementById('musicBtn');
  if (bgm.paused) {
    bgm.play();
    btn.textContent = '🔊';
  } else {
    bgm.pause();
    btn.textContent = '🔇';
  }
}

// ===== 拖拽归位 =====
document.querySelectorAll('.shelf').forEach(shelf => {
  shelf.addEventListener('dragover', e => {
    e.preventDefault();
    shelf.classList.add('dragover');
  });
  shelf.addEventListener('dragleave', () => shelf.classList.remove('dragover'));

  shelf.addEventListener('drop', e => {
    e.preventDefault();
    shelf.classList.remove('dragover');

    const id = Number(e.dataTransfer.getData('text/plain'));
    const bookEl = document.querySelector(`.book[data-id="${id}"]`);
    if (!bookEl) return;

    if (bookEl.dataset.category === shelf.dataset.category) {
      shelf.querySelector('.books').appendChild(bookEl);
      bookEl.draggable = false;
      bookEl.style.cursor = 'default';
      const r = bookEl.getBoundingClientRect();
      sparkle(r.left + r.width/2, r.top);
      checkWin();
    } else {
      bookEl.animate([
        { transform:'translateX(0)' }, { transform:'translateX(-6px)' },
        { transform:'translateX(6px)' }, { transform:'translateX(0)' }
      ], { duration:250 });
      shelf.style.borderColor = '#a83232';
      setTimeout(() => shelf.style.borderColor = '#2a1f14', 350);
    }
  });
});

function sparkle(x, y) {
  const s = document.createElement('div');
  s.textContent = '✦';
  s.style.cssText = `position:fixed; left:${x}px; top:${y}px;
    font-size:22px; color:#b8975a; pointer-events:none;
    transition:all .7s ease-out; z-index:99;`;
  document.body.appendChild(s);
  requestAnimationFrame(() => {
    s.style.transform = 'translateY(-50px) scale(1.8)';
    s.style.opacity = '0';
  });
  setTimeout(() => s.remove(), 750);
}

function checkWin() {
  if (desk.querySelectorAll('.book').length === 0) {
    document.getElementById('winModal').classList.add('show');
  }
}
</script>
</body>
</html>
